<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#8d2a22">
    <title>Offline - Kasir Jazzel</title>
    <style>
        * { box-sizing: border-box; }
        body {
            display: grid;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            place-items: center;
            color: #3a3334;
            background: #f7f3f3;
            font-family: "Segoe UI", Tahoma, sans-serif;
            text-align: center;
        }
        main {
            width: min(100%, 420px);
            padding: 32px 24px;
            border: 1px solid #e9dada;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 12px 36px rgba(58, 51, 52, .08);
        }
        img { width: 76px; height: 76px; object-fit: contain; }
        h1 { margin: 18px 0 8px; color: #8d2a22; font-size: 24px; }
        p { margin: 0; color: #766d6f; line-height: 1.6; }
        button {
            min-height: 44px;
            margin-top: 24px;
            padding: 0 20px;
            border: 0;
            border-radius: 8px;
            color: #fff;
            background: #8d2a22;
            font: inherit;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main>
        <img src="/assets/img/pwa-icon-192.png" alt="Logo Toko Jazzel">
        <h1>Koneksi internet terputus</h1>
        <p>Halaman dan transaksi memerlukan koneksi internet. Sambungkan kembali perangkat, lalu coba lagi.</p>
        <button type="button" onclick="window.location.reload()">Coba lagi</button>
    </main>
</body>
</html>
